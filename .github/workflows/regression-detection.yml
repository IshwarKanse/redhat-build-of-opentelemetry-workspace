# Upstream Regression Detection for Red Hat build of OpenTelemetry
#
# Runs on a fixed schedule roughly every six weeks (~1.5 months) — reports
# are large enough that more frequent runs outpace the time needed to act on
# one — regardless of whether the upstream operator version has changed
# since the last run. Can also be triggered manually. Generated reports are
# committed directly to main under reports/.
#
# Split into two jobs on purpose: detect-regressions runs the AI agent
# (claude -p --dangerously-skip-permissions) and only ever holds read-only
# tokens, so a misbehaving or misdirected tool call there has no path to
# writing to the repo. publish-report holds the only contents: write
# permission in this workflow, runs no AI/agent code, and only ever commits
# the two report files that detect-regressions uploaded as an artifact.
#
# Required secrets:
#   ANTHROPIC_API_KEY           — Anthropic API key for Claude
#   OR (for Vertex AI):
#   GCP_CREDENTIALS_JSON        — GCP service account key JSON
#   ANTHROPIC_VERTEX_PROJECT_ID — GCP project ID

name: Regression Detection

on:
  schedule:
    # Alternates two fixed dates, each ~45 days (~6 weeks) apart, all year:
    # 1st of Jan/Apr/Jul/Oct, then 15th of Feb/May/Aug/Nov. Cron can't express
    # a rolling "every N weeks" interval, so this approximates it with fixed
    # calendar dates instead of adding runtime state to track the last run.
    - cron: '57 7 1 1,4,7,10 *'
    - cron: '57 7 15 2,5,8,11 *'
  workflow_dispatch:
    inputs:
      method:
        description: 'Detection method (base versions are derived from konflux-opentelemetry)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - changelog
          - code-diff
          - feature-gates
          - issues
          - doc-validation
          - test-coverage
          - dependencies

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  detect-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      latest_tag: ${{ steps.release-check.outputs.latest_tag }}
      reported: ${{ steps.run-detection.outputs.reported }}
      report_date: ${{ steps.run-detection.outputs.report_date }}
      artifact_name: regression-report-${{ steps.release-check.outputs.latest_tag }}-${{ github.run_id }}

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Get latest upstream release tag
        id: release-check
        run: |
          # Get the latest upstream operator release tag (strip ^{} from annotated tags)
          # — purely informational at this point (commit messages, job summary,
          # artifact name); it no longer gates whether this run proceeds.
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/open-telemetry/opentelemetry-operator.git 'refs/tags/v*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' | sort -Vru | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: could not determine the latest upstream operator tag." >&2
            exit 1
          fi
          echo "Latest upstream operator release: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://downloads.claude.ai/keys/claude-code.asc \
            | sudo tee /etc/apt/keyrings/claude-code.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main" \
            | sudo tee /etc/apt/sources.list.d/claude-code.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends claude-code

      - name: Install dependencies
        run: |
          sudo apt-get install -y --no-install-recommends jq python3 python3-yaml

      - name: Configure GCP credentials (Vertex AI)
        if: vars.CLAUDE_CODE_USE_VERTEX == '1'
        run: |
          mkdir -p /tmp/gcp
          echo "$GCP_CREDENTIALS_JSON" > /tmp/gcp/key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp/key.json" >> "$GITHUB_ENV"
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Use HTTPS for cloning (CI runner has no SSH key)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Clone repos
        run: make clone-repos

      - name: Run regression detection
        id: run-detection
        env:
          # Read-only: this job's permissions block grants only contents: read,
          # issues: read, pull-requests: read — the AI agent below never has
          # write access, by design (see file header).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_USE_VERTEX: ${{ vars.CLAUDE_CODE_USE_VERTEX || '' }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION || 'global' }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID || '' }}
          # The regression-detection Workflow runs as a background task. In print
          # mode (`claude -p`), the CLI only waits up to this ceiling before killing
          # any still-running background task and exiting — without it, a workflow
          # that takes longer than the 600s default gets terminated before the
          # report is ever written. Wait indefinitely instead; the job's own
          # timeout-minutes and --max-budget-usd remain the real caps.
          CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '0'
        run: |
          METHOD="${{ inputs.method }}"
          ARGS=""
          if [ -n "$METHOD" ]; then
            ARGS="--method $METHOD"
          fi
          claude -p "/otel-regression-detection $ARGS" \
            --dangerously-skip-permissions \
            --output-format text \
            --allowedTools "Bash,Read,Write,Edit,Workflow,Agent" \
            --max-budget-usd 25 \
            </dev/null

          # Only report success if the report actually landed — claude -p can
          # exit 0 without producing anything (e.g. the background workflow got
          # killed mid-run), and the publish job must not try to commit a
          # report that was never written.
          # The report filename embeds the downstream operator version
          # (discovered at runtime), which this shell doesn't know ahead of
          # time — match by date suffix instead of an exact name. Recorded as
          # a job output (not recomputed downstream) so the publish job can't
          # land on a different date if the two jobs straddle UTC midnight.
          REPORT_DATE=$(date +%Y-%m-%d)
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          if compgen -G "reports/regression-summary-v*-${REPORT_DATE}.json" > /dev/null && compgen -G "reports/regression-detection-v*-${REPORT_DATE}.md" > /dev/null; then
            echo "reported=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Report files for $REPORT_DATE not found — the publish job will be skipped this run."
            echo "reported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ steps.release-check.outputs.latest_tag }}-${{ github.run_id }}
          path: reports/regression-*
          retention-days: 90
          if-no-files-found: warn

      - name: Post summary to job
        if: always()
        run: |
          REPORT_DATE="${{ steps.run-detection.outputs.report_date }}"
          REPORT_FILE=$(ls reports/regression-detection-v*-${REPORT_DATE}.md 2>/dev/null | head -1)
          SUMMARY_FILE=$(ls reports/regression-summary-v*-${REPORT_DATE}.json 2>/dev/null | head -1)

          echo "## Regression Detection — ${{ steps.release-check.outputs.latest_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$SUMMARY_FILE" ]; then
            CRITICAL=$(jq -r '.summary_counts.critical // 0' "$SUMMARY_FILE")
            HIGH=$(jq -r '.summary_counts.high // 0' "$SUMMARY_FILE")
            MEDIUM=$(jq -r '.summary_counts.medium // 0' "$SUMMARY_FILE")
            LOW=$(jq -r '.summary_counts.low // 0' "$SUMMARY_FILE")
            TOTAL=$(jq -r '.summary_counts.total // 0' "$SUMMARY_FILE")

            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Critical | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| High | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Medium | $MEDIUM |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Low | $LOW |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Total** | **$TOTAL** |" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$REPORT_FILE" ]; then
            echo "Summary counts unavailable — see the full Markdown report in the uploaded artifact (${REPORT_FILE})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated. Check job logs for errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp/key.json

  publish-report:
    needs: detect-regressions
    if: success() && needs.detect-regressions.outputs.reported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Download regression report artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-regressions.outputs.artifact_name }}
          path: /tmp/report-artifact

      - name: Copy only the expected report files into reports/
        run: |
          # Defense in depth: only ever stage the two known report filename
          # patterns for today's date, regardless of what else the artifact
          # might contain — this job holds contents: write and must not
          # blindly trust artifact contents produced by the AI-driven job.
          # The version segment is discovered at runtime by the workflow, so
          # match by date suffix rather than an exact name. The date comes
          # from detect-regressions' output, not a fresh `date` call here, so
          # the two jobs can't disagree if they straddle UTC midnight.
          REPORT_DATE="${{ needs.detect-regressions.outputs.report_date }}"
          shopt -s nullglob
          SUMMARY_MATCHES=(/tmp/report-artifact/regression-summary-v*-${REPORT_DATE}.json)
          REPORT_MATCHES=(/tmp/report-artifact/regression-detection-v*-${REPORT_DATE}.md)
          shopt -u nullglob
          if [ "${#SUMMARY_MATCHES[@]}" -ne 1 ] || [ "${#REPORT_MATCHES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one regression-summary-v*-${REPORT_DATE}.json (found ${#SUMMARY_MATCHES[@]}) and exactly one regression-detection-v*-${REPORT_DATE}.md (found ${#REPORT_MATCHES[@]}) in artifact ${{ needs.detect-regressions.outputs.artifact_name }}" >&2
            exit 1
          fi
          for f in "${SUMMARY_MATCHES[@]}" "${REPORT_MATCHES[@]}"; do
            cp "$f" "reports/$(basename "$f")"
          done

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/regression-summary-*.json reports/regression-detection-*.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add regression detection report for ${{ needs.detect-regressions.outputs.latest_tag }}"
            git push origin HEAD:main
          fi
