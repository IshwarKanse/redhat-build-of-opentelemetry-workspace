# Upstream Regression Detection for Red Hat build of OpenTelemetry
#
# Checks weekly for new upstream operator releases and runs regression
# detection when a new release is found. Skips if a report already exists
# for the latest release. Can also be triggered manually.
#
# Required secrets:
#   ANTHROPIC_API_KEY           — Anthropic API key for Claude
#   OR (for Vertex AI):
#   GCP_CREDENTIALS_JSON        — GCP service account key JSON
#   ANTHROPIC_VERTEX_PROJECT_ID — GCP project ID

name: Regression Detection

on:
  schedule:
    # Weekly on Monday at 07:57 UTC — checks for new releases, skips if already reported
    - cron: '57 7 * * 1'
  workflow_dispatch:
    inputs:
      method:
        description: 'Detection method (base versions are derived from konflux-opentelemetry)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - changelog
          - code-diff
          - feature-gates
          - issues
          - doc-validation
          - test-coverage
          - dependencies
      force:
        description: 'Force run even if a report exists for the latest release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  detect-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Restore last-reported-version marker
        uses: actions/cache@v4
        with:
          path: reports/.last-reported-version
          key: regression-last-reported-version

      - name: Check for new upstream release
        id: release-check
        run: |
          # Get the latest upstream operator release tag (strip ^{} from annotated tags)
          LATEST_TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/open-telemetry/opentelemetry-operator.git 'refs/tags/v*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' | sort -Vru | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: could not determine the latest upstream operator tag." >&2
            exit 1
          fi
          echo "Latest upstream operator release: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          # Check if we already have a report for this version
          MARKER_FILE="reports/.last-reported-version"
          LAST_REPORTED=""
          if [ -f "$MARKER_FILE" ]; then
            LAST_REPORTED=$(cat "$MARKER_FILE")
          fi
          echo "Last reported version: ${LAST_REPORTED:-'(none)'}"

          if [ "$LAST_REPORTED" = "$LATEST_TAG" ] && [ "${{ inputs.force }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Report already exists for $LATEST_TAG. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New release detected or manual trigger. Running regression detection."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.release-check.outputs.skip != 'true'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://downloads.claude.ai/keys/claude-code.asc \
            | sudo tee /etc/apt/keyrings/claude-code.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main" \
            | sudo tee /etc/apt/sources.list.d/claude-code.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends claude-code

      - name: Install dependencies
        if: steps.release-check.outputs.skip != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends jq python3 python3-yaml

      - name: Configure GCP credentials (Vertex AI)
        if: steps.release-check.outputs.skip != 'true' && vars.CLAUDE_CODE_USE_VERTEX == '1'
        run: |
          mkdir -p /tmp/gcp
          echo "$GCP_CREDENTIALS_JSON" > /tmp/gcp/key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp/key.json" >> "$GITHUB_ENV"
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Clone repos
        if: steps.release-check.outputs.skip != 'true'
        run: make clone-repos

      - name: Run regression detection
        if: steps.release-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_USE_VERTEX: ${{ vars.CLAUDE_CODE_USE_VERTEX || '' }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION || 'global' }}
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID || '' }}
        run: |
          METHOD="${{ inputs.method }}"
          ARGS=""
          if [ -n "$METHOD" ]; then
            ARGS="--method $METHOD"
          fi
          claude -p "/otel-regression-detection $ARGS" \
            --dangerously-skip-permissions \
            --output-format text \
            --allowedTools "Bash,Read,Write,Edit,Workflow,Agent" \
            --max-budget-usd 25 \
            </dev/null

          # Record the version we just reported on
          mkdir -p reports
          echo "${{ steps.release-check.outputs.latest_tag }}" > reports/.last-reported-version

      - name: Save last-reported-version marker
        if: always() && steps.release-check.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: reports/.last-reported-version
          key: regression-last-reported-version

      - name: Upload regression report
        if: always() && steps.release-check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ steps.release-check.outputs.latest_tag }}-${{ github.run_id }}
          path: reports/regression-*
          retention-days: 90
          if-no-files-found: warn

      - name: Post summary to job
        if: always() && steps.release-check.outputs.skip != 'true'
        run: |
          REPORT_DATE=$(date +%Y-%m-%d)
          REPORT_FILE="reports/regression-report-${REPORT_DATE}.md"
          SUMMARY_FILE="reports/regression-summary-${REPORT_DATE}.json"

          echo "## Regression Detection — ${{ steps.release-check.outputs.latest_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$SUMMARY_FILE" ]; then
            CRITICAL=$(jq -r '.summary_counts.critical // 0' "$SUMMARY_FILE")
            HIGH=$(jq -r '.summary_counts.high // 0' "$SUMMARY_FILE")
            MEDIUM=$(jq -r '.summary_counts.medium // 0' "$SUMMARY_FILE")
            LOW=$(jq -r '.summary_counts.low // 0' "$SUMMARY_FILE")
            TOTAL=$(jq -r '.summary_counts.total // 0' "$SUMMARY_FILE")

            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Critical | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| High | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Medium | $MEDIUM |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Low | $LOW |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Total** | **$TOTAL** |" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$REPORT_FILE" ]; then
            head -50 "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated. Check job logs for errors." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post skip summary
        if: steps.release-check.outputs.skip == 'true'
        run: |
          echo "## Regression Detection — Skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No new upstream release since last report (${{ steps.release-check.outputs.latest_tag }})." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp/key.json
