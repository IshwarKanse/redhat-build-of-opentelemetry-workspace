apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
   name: art-catalog-otel
   namespace: openshift-marketplace
spec:
   sourceType: grpc
   image: <OTEL_FBC_IMAGE>
   displayName: ART Catalog OTEL
   publisher: grpc
---
# The e2e suites (tests/e2e, tests/e2e-openshift, ...) and the CI jobs expect the operator in
# opentelemetry-operator-system, with the cluster-monitoring label for its metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: opentelemetry-operator-system
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: opentelemetry-operator-system
  namespace: opentelemetry-operator-system
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opentelemetry-product
  namespace: opentelemetry-operator-system
spec:
  channel: stable
  installPlanApproval: Automatic
  name: opentelemetry-product
  source: art-catalog-otel
  sourceNamespace: openshift-marketplace
